<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ketshopweb CMS · ปรับแต่ง — Prototype V1–V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds/ketshopweb-ds-tokens.css">
<link rel="stylesheet" href="assets/fa/css/all.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font-heading);font-size:13px;color:var(--ink-900);background:var(--ink-100);overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange-500);outline-offset:2px}
  #app{display:flex;height:100vh}
  #sidebar{flex:none}
  #view{flex:1;min-width:0;height:100vh;position:relative;display:flex;flex-direction:column}
  .clickable{cursor:pointer}
  .sb-item{width:100%;text-align:left}
  .sb-item:hover{background:rgba(255,255,255,.06)}
  .sb-item.on:hover{background:var(--red-600)}
  [data-sec]{cursor:pointer}
  .empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--ink-500);padding:24px}
  .empty b{color:var(--ink-900)}

  /* ---- bottom-centre version dock (prototype chrome, not part of the design) ---- */
  #dock{position:fixed;left:calc(var(--sbw,0px) + (100vw - var(--sbw,0px)) / 2);bottom:14px;transform:translateX(-50%);z-index:100;font-family:var(--font-heading)}
  .dock-bar{display:flex;align-items:center;gap:4px;background:var(--ink-900);color:#fff;border-radius:999px;padding:5px;box-shadow:0 12px 32px -8px rgba(10,11,15,.45),0 0 0 1px rgba(255,255,255,.06)}
  .dock-btn{height:32px;border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;white-space:nowrap}
  .dock-btn:hover{background:rgba(255,255,255,.08)}
  .dock-vers{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
  .dock-v{height:26px;min-width:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
  .dock-v:hover{color:#fff}
  .dock-v.on{background:#fff;color:var(--ink-900)}
  .dock-sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 2px}
  .dock-pop{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:420px;max-height:70vh;overflow:auto;background:#fff;color:var(--ink-900);border-radius:16px;box-shadow:var(--shadow-3xl);border:1px solid var(--ink-150);padding:8px}
  .pop-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 10px;border-bottom:1px solid var(--ink-100);margin-bottom:6px}
  .pop-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px}
  .pop-row.on{background:var(--ink-50)}
  .pop-ico{width:30px;height:30px;border-radius:8px;background:var(--ink-100);display:grid;place-items:center;color:var(--ink-600);flex:none}
  .pop-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--ink-200);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:#fff}
  .chip:hover{border-color:var(--ink-400)}
  .chip.on{background:var(--ink-900);border-color:var(--ink-900);color:#fff}
  .chip[disabled]{color:var(--ink-300);border-style:dashed;cursor:not-allowed}
  .kbd{font-family:var(--font-display);font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--ink-100);color:var(--ink-600)}
  .fb{transition:bottom .2s}
  body.dock-on .fb{bottom:66px !important}
  .toast{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--ink-900);border:1px solid var(--ink-150);box-shadow:var(--shadow-xl);border-radius:10px;padding:9px 14px;font-size:12.5px}
  .pg-row:hover{background:var(--ink-50) !important}
  .pg-card:hover{box-shadow:var(--shadow-md) !important}
  .dock-mini{width:44px;height:30px;border-radius:999px 999px 0 0;background:var(--ink-900);color:#fff;display:grid;place-items:center;position:fixed;bottom:0;box-shadow:var(--shadow-lg)}

  /* ---- index ---- */
  .idx{flex:1;overflow:auto;padding:40px 48px 120px;background:var(--ink-50)}
  .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:24px}
  .idx-card{background:#fff;border:1px solid var(--ink-150);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .idx-card.ready{border-color:var(--ink-200);box-shadow:var(--shadow-sm)}
  .tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="view"></main>
</div>
<div id="dock"></div>

<script>
/* =====================================================================
   Ketshopweb CMS · ปรับแต่ง — prototype สำหรับเทียบไอเดีย
   1 เวอร์ชัน = หลังบ้านทั้งชุด (sidebar + ทุกหน้า) ในแนวคิดเดียว
   V1 = แนว A ปลอดภัย · V2 = แนว B กล้า · V3 = แนว C ลูกผสม  (จาก "Ketshopweb CMS Mockups.dc.html")
   แถบล่างกลาง = เครื่องมือของผู้ออกแบบไว้สลับเทียบเวอร์ชัน ไม่ใช่ส่วนของระบบ
   ===================================================================== */

const IMG = 'assets/img/';

const VERSIONS = [
  { id:'v1', label:'V1', name:'ปลอดภัย', track:'แนว A', sidebar:'safe', sbName:'sidebar ดำจัดกลุ่ม 240px',
    desc:'โครงหน้าจอเดิม · panel ขวา Sections / คุณสมบัติ / ประวัติ · ผู้ช่วย Ket เป็นช่องเล็กท้าย panel' },
  { id:'v2', label:'V2', name:'กล้า', track:'แนว B', sidebar:'bold', sbName:'sidebar ดำเดิม ย่อเป็นไอคอน 72px ได้',
    desc:'พื้นครีม · panel ลอย · หน้าเลือกแบบ prompt ใหญ่กลางจอ · แชทผู้ช่วย Ket ขวาแบบ Lovable' },
  { id:'v3', label:'V3', name:'ลูกผสม', track:'แนว C', sidebar:'safe', sbName:'sidebar ดำจัดกลุ่ม 240px',
    desc:'โครง 3 ช่องเดิม + ลูกเล่นจาก B · ผู้ช่วย Ket เป็น tab ใน panel ขวา · toolbar ลอยบน canvas' },
];
const SCREENS = [
  { id:'entry',         short:'หน้าเลือก',    name:'หน้าเลือก · ปรับแต่งเว็บไซต์', sb:'Page Layouts',  icon:'far fa-window-restore' },
  { id:'page',          short:'แต่งหน้าเว็บ', name:'แต่งหน้าเว็บ · Page Layout',   sb:'Page Layouts',  icon:'fas fa-th-large' },
  { id:'menu',          short:'Menu',         name:'Menu',                        sb:'Menu',          icon:'fas fa-stream' },
  { id:'header',        short:'Header',       name:'Header',                      sb:'Header',        icon:'fas fa-heading' },
  { id:'footer',        short:'Footer',       name:'Footer',                      sb:'Footer',        icon:'fas fa-shoe-prints' },
  { id:'system-design', short:'System Design',name:'System Design · สี & ฟอนต์',  sb:'System Design', icon:'fas fa-palette' },
];
const REF = {
  v1:{ entry:'1d', page:'1b', menu:'1f', header:'1h', footer:'1j', 'system-design':'1l' },
  v2:{ entry:'1e', page:'1c', menu:'1g', header:'1i', footer:'1k', 'system-design':'1m' },
  v3:{ entry:'3f', page:'3a', menu:'3b', header:'3c', footer:'3d', 'system-design':'3e' },
};
const RENDER = {
  v1:{ entry:()=>entryA(), page:()=>plA() },
  v2:{ entry:()=>entryB(), page:()=>plB() },
  v3:{ entry:()=>entryC(), page:()=>plC() },
};
const ready = (v, s) => !!(RENDER[v] && RENDER[v][s]);

/* ---------- state ---------- */
const S = { v:null, screen:null, missing:null, tab:'front', sel:'hero', device:'desktop', panel:{}, diff:{hero:null, prod:null},
  compare:'after', pop:false, mini:false, v2Collapsed:null, toast:null };

/* ---------- lock levels (from mockup data) ---------- */
const L = {
  L0:{bg:'var(--success-100)',fg:'var(--success-700)'},
  L1:{bg:'var(--info-100)',fg:'var(--info-700)'},
  L2:{bg:'var(--warning-100)',fg:'var(--warning-700)'},
  L3:{bg:'var(--ink-150)',fg:'var(--ink-700)'},
};
const SECTIONS = [
  { key:'header',   name:'Header',             meta:'Header_ห้ามลบ · 3 elements', lock:'L2', icon:'far fa-window-maximize', thumb:'#dfe7f3' },
  { key:'marquee',  name:'ข้อความวิ่ง · SALE',  meta:'Marquee',                    lock:'L0', icon:'fas fa-text-width',      thumb:'#fff' },
  { key:'hero',     name:'Hero Banner',        meta:'Slider · 2 สไลด์',            lock:'L0', icon:'far fa-image',           thumb:'linear-gradient(160deg,#d9b493,#5e3b28)' },
  { key:'marquee2', name:'ข้อความวิ่ง · SALE',  meta:'Marquee',                    lock:'L0', icon:'fas fa-text-width',      thumb:'#fff' },
  { key:'products', name:'Product · แนะนำ',     meta:'Product_ห้ามลบ · 4 ชิ้น',     lock:'L0', icon:'fas fa-th-large',        thumb:'#f6dfe6' },
  { key:'benefit',  name:'benefit',            meta:'รูปภาพ · 1 element',          lock:'L0', icon:'far fa-image',           thumb:'#bfbfbf' },
  { key:'footer',   name:'Footer',             meta:'Footer_ห้ามลบ',              lock:'L2', icon:'fas fa-window-minimize', thumb:'#2d2a28' },
];
const PRODUCTS = [
  { name:'Aloe Water Jelly 50ml', price:'฿590',   bg:'#f6dfe6' },
  { name:'Hydra Gel Cream',       price:'฿690',   bg:'#f3f3f3' },
  { name:'Happy Frog Mask Set',   price:'฿290',   bg:'#e6f0fb' },
  { name:'Scrunchie Bag Mini',    price:'฿1,290', bg:'#ecebf5' },
];
const DEVICE_W = { desktop:620, tablet:480, mobile:360 };

/* ---------- pages shown on the entry screens (mockup data) ---------- */
const pg = (name, path, lock, when, status, thumb, sel) => ({ name, path, lock, when, status, thumb, sel });
const PAGES_ON = [
  pg('หน้าแรก', '/home', 'L0', 'แก้ 2 นาทีที่แล้ว', 'ฉบับร่าง', 'linear-gradient(160deg,#d9b493,#5e3b28)', true),
  pg('COLLECTION', '/collection', 'L1', 'เมื่อวาน', 'เผยแพร่แล้ว', '#f6dfe6'),
  pg('PRODUCT', '/product', 'L1', '3 วันก่อน', 'เผยแพร่แล้ว', '#e6f0fb'),
  pg('PROMOTION', '/promotion', 'L0', '5 วันก่อน', 'เผยแพร่แล้ว', '#fde9c9'),
  pg('BLOG', '/blog', 'L1', '1 สัปดาห์', 'เผยแพร่แล้ว', '#ecebf5'),
  pg('CONTACT', '/contact', 'L0', '2 สัปดาห์', 'เผยแพร่แล้ว', '#e8f5ee'),
];
const PAGES_OFF = [
  pg('Landing 11.11', '/sale-1111', 'L0', 'แก้ 1 ชม.ที่แล้ว', 'ฉบับร่าง', '#13151B'),
  pg('About us', '/about', 'L0', '1 เดือน', 'เผยแพร่แล้ว', '#f3f3f3'),
  pg('Size guide', '/size-guide', 'L0', '2 เดือน', 'เผยแพร่แล้ว', '#fff7ed'),
];
const PAGES_SYS = [
  pg('รายละเอียดสินค้า', '/product/:id', 'L1', 'เมื่อวาน', 'เผยแพร่แล้ว', '#e6f0fb'),
  pg('ตะกร้า', '/cart', 'L2', '—', 'เผยแพร่แล้ว', '#f7f8fa'),
  pg('ชำระเงิน', '/checkout', 'L2', '—', 'เผยแพร่แล้ว', '#f7f8fa'),
  pg('สมัครสมาชิก / เข้าสู่ระบบ', '/register', 'L2', '—', 'เผยแพร่แล้ว', '#f7f8fa'),
  pg('ขอบคุณ (Thank you)', '/thankyou', 'L3', 'ระบบ', 'เผยแพร่แล้ว', '#eef0f4'),
];
const PAGE_GROUPS = [
  { key:'on',  label:'หน้าบนเมนู',  count:7,  note:'แก้ได้ตามระดับ',     icon:'fa fa-bars',  pages:PAGES_ON },
  { key:'off', label:'หน้านอกเมนู', count:3,  note:'Landing / Sale page', icon:'far fa-file', pages:PAGES_OFF },
  { key:'sys', label:'หน้าของระบบ', count:12, note:'L2 แก้ค่า · L3 ล็อก', icon:'fas fa-lock', pages:PAGES_SYS },
];
const pageDot = p => p.status === 'ฉบับร่าง' ? 'var(--warning-500)' : 'var(--success-500)';

/* =====================================================================
   SIDEBARS — CmsSidebar variant "safe" (V1, V3) and "bold" (V2)
   ===================================================================== */
const FRONT = [
  { label:'ออกแบบ · Design', items:[['Page Layouts','fas fa-th-large'],['Header','fas fa-heading'],['Footer','fas fa-shoe-prints'],['Menu','fas fa-stream'],['System Design','fas fa-palette','ใหม่'],['เทมเพลต','far fa-clone','ย้าย']] },
  { label:'เนื้อหา · Content', items:[['Product Display','fas fa-store'],['Blog Manager','fas fa-pen-nib'],['Coupon Display','fas fa-ticket-alt'],['Event Popup','far fa-window-restore'],['Sidebar','fas fa-columns'],['Media','far fa-images','⇄']] },
  { label:'เว็บไซต์ & SEO', items:[['SEO','fas fa-search-location','ย้าย'],['Conversion Tools','fas fa-chart-pie','ย้าย'],['Google Map','fas fa-map-marked-alt','ย้าย'],['Cookie · PDPA banner','fas fa-cookie-bite','⇄'],['Language','fas fa-globe-asia']] },
  { label:'ขั้นสูง · Advanced', items:[['Button','far fa-hand-pointer'],['Advance CSS','fas fa-code'],['Maintenance','fas fa-tools']] },
];
const MANAGE = [
  { label:'ภาพรวม · Overview', items:[['Overview','fas fa-tachometer-alt'],['Dashboard','fas fa-chart-line','▾']] },
  { label:'ขาย · Sales', items:[['E-commerce','fas fa-receipt','▾'],['Marketing','fas fa-bullhorn','▾'],['Delivery Manager','fas fa-shipping-fast','▾']] },
  { label:'สินค้า & ลูกค้า', items:[['Product Manager','fas fa-box-open','▾'],['Warehouse','fas fa-boxes','▾'],['Users','fas fa-user-friends','▾']] },
  { label:'ระบบ · System', items:[['Media','far fa-images','⇄'],['Email','far fa-envelope'],['Extension','fas fa-plug'],['History Logs','fas fa-history']] },
  { label:'ตั้งค่าร้าน · Setting', items:[['ทั่วไป','fas fa-sliders-h'],['การขาย · ขนส่ง · ชำระเงิน','far fa-credit-card'],['การแจ้งเตือน','fas fa-bell'],['PDPA · นโยบาย','fas fa-shield-alt','⇄']] },
];
const curVersion = () => VERSIONS.find(v => v.id === S.v) || null;
const curScreen = () => SCREENS.find(s => s.id === S.screen) || null;
const v2Collapsed = () => S.v2Collapsed !== null ? S.v2Collapsed : (S.screen === 'entry' || S.screen === 'page');
function sidebarWidth(){ const v = curVersion(); if (!v) return 0; return v.sidebar === 'bold' && v2Collapsed() ? 72 : 240; }
function activeItem(){ if (S.missing) return S.missing; const s = curScreen(); return s ? s.sb : null; }

function renderSidebar(){
  const el = document.getElementById('sidebar');
  const v = curVersion();
  document.body.style.setProperty('--sbw', sidebarWidth() + 'px');
  if (!v) { el.innerHTML = ''; return; }
  el.innerHTML = v.sidebar === 'safe' ? sidebarSafe() : (v2Collapsed() ? sidebarBoldNarrow() : sidebarBoldWide());
}
function sidebarSafe(){
  const active = activeItem(); const groups = S.tab === 'front' ? FRONT : MANAGE;
  const tg = on => on ? 'background:var(--ink-0);color:var(--ink-900);font-weight:600' : 'background:transparent;color:var(--ink-400);font-weight:500';
  return `
  <div style="width:240px;height:100vh;background:var(--ink-900);display:flex;flex-direction:column;font-family:var(--font-heading);font-size:13px;color:var(--ink-300)">
    <div style="height:56px;display:flex;align-items:center;padding:0 20px;flex:none;border-bottom:1px solid var(--ink-800)"><img src="${IMG}Logo-Light-Color.png" alt="Ketshopweb" style="height:24px;width:auto"></div>
    <div style="padding:14px 14px 6px">
      <div role="tablist" style="display:flex;background:var(--ink-800);border-radius:var(--radius-md);padding:3px;font-size:12px">
        <button role="tab" aria-selected="${S.tab==='back'}" data-tab="back" style="flex:1;text-align:center;padding:5px 0;border-radius:6px;${tg(S.tab==='back')}">จัดการ</button>
        <button role="tab" aria-selected="${S.tab==='front'}" data-tab="front" style="flex:1;text-align:center;padding:5px 0;border-radius:6px;${tg(S.tab==='front')}">ปรับแต่ง</button>
      </div>
    </div>
    <nav style="flex:1;overflow:auto;padding:4px 10px">
      ${groups.map(g => `
        <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);font-weight:600;padding:6px 10px 2px;font-family:var(--font-display)">${g.label}</div>
        ${g.items.map(([label, icon, hint]) => { const on = S.tab === 'front' && label === active; return `
          <button class="sb-item${on?' on':''}" data-sb="${label}" style="height:30px;display:flex;align-items:center;padding:0 10px;gap:10px;border-radius:var(--radius-md);background:${on?'var(--red-600)':'transparent'};color:${on?'#fff':'var(--ink-300)'};font-weight:${on?600:400}">
            <span style="width:18px;font-size:13px;text-align:center;flex:none;opacity:.9"><i class="${icon}"></i></span>
            <span style="flex:1">${label}</span>
            <span style="font-size:10px;color:${on?'rgba(255,255,255,.7)':'var(--ink-500)'}">${hint||''}</span>
          </button>`; }).join('')}
      `).join('')}
    </nav>
    <div style="padding:8px 14px 10px;border-top:1px solid var(--ink-800);display:flex;align-items:center;gap:10px">
      <div style="width:30px;height:30px;border-radius:50%;background:var(--ink-0);overflow:hidden;flex:none"><img src="${IMG}mascot-hello.png" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 20%"></div>
      <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--ink-100)">ผู้ช่วย Ket</div><div style="font-size:11px;color:var(--ink-500)">พร้อมช่วยเสมอ · ⌘K</div></div>
      <span style="font-size:11px;color:var(--ink-500)">8.7.4</span>
    </div>
  </div>`;
}
function sidebarBoldWide(){
  const active = activeItem(); const groups = S.tab === 'front' ? FRONT : MANAGE; const back = S.tab === 'back';
  return `
  <div style="width:240px;height:100vh;background:#1a1a1a;display:flex;flex-direction:column;font-family:var(--font-heading);font-size:14px;color:rgba(255,255,255,.7)">
    <div style="height:60px;display:flex;align-items:center;padding:0 12px 0 20px;flex:none;border-bottom:1px solid rgba(255,255,255,.08);gap:8px"><img src="${IMG}Logo-Light-Color.png" alt="Ketshopweb" style="height:26px;width:auto"><button data-collapse="1" title="ย่อเมนู" style="margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:rgba(255,255,255,.55);background:rgba(255,255,255,.06)"><i class="fas fa-angle-double-left" style="font-size:13px"></i></button></div>
    <div style="padding:10px 14px 4px">
      <div role="tablist" style="display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;font-size:13px;font-weight:600">
        <button role="tab" aria-selected="${back}" data-tab="back" style="flex:1;text-align:center;padding:5px 0;border-radius:8px;${back?'background:#fff;color:#1a1a1a':'color:rgba(255,255,255,.6)'}">จัดการ</button>
        <button role="tab" aria-selected="${!back}" data-tab="front" style="flex:1;text-align:center;padding:5px 0;border-radius:8px;${!back?'background:#fff;color:#1a1a1a':'color:rgba(255,255,255,.6)'}">ปรับแต่ง</button>
      </div>
    </div>
    <nav style="flex:1;overflow:auto;padding:4px 12px">
      ${groups.map(g => `
        <div style="font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.4);font-weight:600;padding:6px 10px 2px;line-height:1.3">${g.label}</div>
        ${g.items.map(([label, icon, hint]) => { const on = !back && label === active; return `
          <button class="sb-item${on?' on-bold':''}" data-sb="${label}" style="height:31px;display:flex;align-items:center;padding:0 10px;gap:12px;border-radius:9px;background:${on?'#E85440':'transparent'};color:${on?'#fff':'rgba(255,255,255,.7)'};font-weight:${on?600:400}">

    <div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-500);font-family:var(--font-display)">KETSHOPWEB CMS · ปรับแต่ง · PROTOTYPE</div>
    <h1 style="margin:6px 0 6px;font-size:26px;font-weight:700">หน้ารวมเวอร์ชัน</h1>
    <div style="color:var(--ink-600);max-width:720px;line-height:1.6">1 เวอร์ชัน = หลังบ้านทั้งชุด (sidebar + ทุกหน้า) ในแนวคิดเดียว · เข้าไปแล้วเดินในระบบได้เหมือนผู้ใช้จริง · สลับเทียบเวอร์ชันที่แถบ<b>ล่างกลาง</b> หรือกด <span class="kbd">[</span> <span class="kbd">]</span> — สลับแล้วยังอยู่หน้าเดิม</div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--ink-500);line-height:1.6">อิงจาก <b>Ketshopweb CMS Mockups.dc.html</b> แนว A / B / C และ Blueprint v0.3 · ร้านตัวอย่าง GIRLY CLOSET เป็นข้อมูลจำลองจาก mockup · ไม่ต่อ backend</div>
    <div class="idx-grid">
      ${VERSIONS.map(v => `
      <div class="idx-card ready">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:40px;height:40px;border-radius:10px;background:var(--ink-900);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--font-display)">${v.label}</span>
          <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:16px">${v.name} <span style="font-weight:500;font-size:12px;color:var(--ink-500)">· ${v.track}</span></div><div style="font-size:11.5px;color:var(--ink-500)">${v.sbName}</div></div>
        </div>
        <div style="font-size:12.5px;color:var(--ink-600);line-height:1.55">${v.desc}</div>
        <button data-open="${v.id}/entry" style="height:38px;border-radius:10px;background:var(--red-600);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px">เข้า ${v.label} · เริ่มที่กด "ปรับแต่ง" <i class="fas fa-arrow-right" style="font-size:11px"></i></button>
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:2px">
          ${SCREENS.map(s => ready(v.id, s.id) ? `
            <button data-open="${v.id}/${s.id}" style="text-align:left;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--ink-150);border-radius:9px;background:#fff">
              <i class="${s.icon}" style="width:16px;text-align:center;color:var(--ink-500)"></i><span style="flex:1;font-weight:600">${s.name}</span><span style="font-family:var(--font-display);font-size:11px;color:var(--ink-400)">${REF[v.id][s.id]}</span><i class="fas fa-arrow-right" style="font-size:10px;color:var(--ink-400)"></i>
            </button>` : `
            <div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px dashed var(--ink-200);border-radius:9px;color:var(--ink-400)">
              <i class="${s.icon}" style="width:16px;text-align:center"></i><span style="flex:1">${s.name}</span><span style="font-family:var(--font-display);font-size:11px">${REF[v.id][s.id]}</span><span class="tag" style="background:var(--ink-100);color:var(--ink-500)">รอบถัดไป</span>
            </div>`).join('')}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderPlaceholder(title, line){
  return `<div class="empty"><div style="max-width:400px;line-height:1.6">
    <i class="far fa-folder-open" style="font-size:26px;color:var(--ink-300)"></i><br>
    <b style="font-size:15px">${title}</b><br>${line}
  </div></div>`;
}

/* =====================================================================
   DOCK — bottom-centre version switcher (designer tool)
   ===================================================================== */
function renderDock(){
  const dock = document.getElementById('dock');
  document.body.classList.toggle('dock-on', !S.mini);
  if (S.mini){
    dock.innerHTML = `<button class="dock-mini" data-dock="expand" title="เปิดแถบเวอร์ชัน" style="left:50%;transform:translateX(-50%)"><i class="fas fa-chevron-up" style="font-size:11px"></i></button>`;
    return;
  }
  const v = curVersion(); const s = curScreen();
  dock.innerHTML = `
    <div class="dock-bar" role="toolbar" aria-label="สลับเวอร์ชันไอเดีย">
      <button class="dock-btn" data-dock="pop" aria-expanded="${S.pop}"><i class="fas fa-layer-group" style="font-size:12px;opacity:.8"></i>${v ? v.label + ' · ' + v.name : 'หน้ารวมเวอร์ชัน'}<i class="fas fa-chevron-${S.pop?'down':'up'}" style="font-size:9px;opacity:.6"></i></button>
      <span class="dock-sep"></span>
      <div class="dock-vers">${VERSIONS.map(x => `<button class="dock-v${v && x.id===v.id?' on':''}" data-ver="${x.id}" title="${x.label} · ${x.name} (${x.track})">${x.label}</button>`).join('')}</div>
      ${v ? `<span style="font-size:11.5px;color:rgba(255,255,255,.6);padding:0 8px 0 4px;white-space:nowrap">${s ? s.short + ' · ' + REF[v.id][s.id] : (S.missing || '')}</span>` : ''}
      <span class="dock-sep"></span>
      <button class="dock-btn" data-go="index" title="หน้ารวมเวอร์ชัน" style="padding:0 10px"><i class="fas fa-th-large" style="font-size:12px"></i></button>
      <button class="dock-btn" data-dock="mini" title="ซ่อนแถบ" style="padding:0 10px"><i class="fas fa-chevron-down" style="font-size:11px"></i></button>
    </div>
    ${S.pop ? `
    <div class="dock-pop" role="dialog" aria-label="เลือกเวอร์ชัน">
      <div class="pop-head"><b>เลือกเวอร์ชัน</b><span style="font-size:11px;color:var(--ink-500)"><span class="kbd">[</span> <span class="kbd">]</span> สลับ · <span class="kbd">Esc</span> ปิด</span></div>
      ${VERSIONS.map(x => `
        <button class="pop-row${v && x.id===v.id?' on':''}" data-ver="${x.id}" style="width:100%;text-align:left">
          <span class="pop-ico" style="background:var(--ink-900);color:#fff;font-weight:700;font-family:var(--font-display);font-size:12px">${x.label}</span>
          <span style="flex:1;min-width:0"><span style="display:block;font-weight:600">${x.name} <span style="font-weight:400;color:var(--ink-500);font-size:11.5px">· ${x.track}</span></span><span style="display:block;font-size:11.5px;color:var(--ink-500);line-height:1.45;margin-top:2px">${x.desc}</span></span>
        </button>`).join('')}
      <button class="pop-row${!v?' on':''}" data-go="index" style="width:100%;text-align:left;align-items:center"><span class="pop-ico"><i class="fas fa-th-large"></i></span><b>หน้ารวมเวอร์ชัน</b></button>
    </div>` : ''}
    ${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}`;
}
let toastTimer;
function toast(msg){ S.toast = msg; renderDock(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderDock(); }, 2400); }

/* =====================================================================
   ROUTER + EVENTS
   ===================================================================== */
function parseHash(){
  const [vid, sid] = location.hash.replace(/^#\/?/, '').split('/');
  S.missing = null;
  const v = VERSIONS.find(x => x.id === vid);
  if (!v) { S.v = null; S.screen = null; return; }
  S.v = v.id;
  if (sid && sid.startsWith('x:')) { S.screen = null; S.missing = decodeURIComponent(sid.slice(2)); return; }
  S.screen = SCREENS.some(x => x.id === sid) ? sid : 'entry';
}
function render(){
  renderSidebar();
  const view = document.getElementById('view');
  const v = curVersion(); const s = curScreen();
  if (!v) view.innerHTML = renderIndex();
  else if (S.tab === 'back') view.innerHTML = renderPlaceholder('ฝั่ง “จัดการ”', 'ไม่อยู่ในขอบเขต prototype นี้ — สนเฉพาะหน้าตกแต่งเว็บ · กด “ปรับแต่ง” เพื่อกลับ');
  else if (S.missing) view.innerHTML = renderPlaceholder(S.missing, 'ยังไม่มี mockup ของเมนูนี้ — ว่างไว้สำหรับลอง idea');
  else if (!ready(v.id, s.id)) view.innerHTML = renderPlaceholder(`${v.label} · ${s.name}`, `มี mockup แล้ว (${REF[v.id][s.id]}) — ทำเป็น prototype ในรอบถัดไป`);
  else view.innerHTML = RENDER[v.id][s.id]();
  renderDock();
}
function go(hash){ S.pop = false; if (location.hash === hash) render(); else location.hash = hash; }
function openVersion(vid){ const tail = S.missing ? 'x:' + encodeURIComponent(S.missing) : (S.screen || 'entry'); go(`#/${vid}/${tail}`); }
function stepVersion(dir){
  const i = VERSIONS.findIndex(x => x.id === S.v);
  const next = VERSIONS[(i + dir + VERSIONS.length) % VERSIONS.length];
  if (i < 0) return go(`#/${next.id}/entry`);
  openVersion(next.id);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-ver],[data-tab],[data-sb],[data-collapse],[data-nav],[data-page],[data-sec],[data-device],[data-panel],[data-diff],[data-compare],[data-dock]');
  if (!t) { if (S.pop && !e.target.closest('#dock')) { S.pop = false; renderDock(); } return; }
  const d = t.dataset;
  if (d.go === 'index') return go('#/');
  if (d.open) { S.tab = 'front'; return go('#/' + d.open); }
  if (d.ver) return openVersion(d.ver);
  if (d.tab) {
    S.tab = d.tab;
    if (d.tab === 'front') return go(`#/${S.v}/entry`);
    return render();
  }
  if (d.sb) {
    S.tab = 'front';
    const s = SCREENS.find(x => x.sb === d.sb);
    return go(`#/${S.v}/${s ? (s.id === 'page' ? 'entry' : s.id) : 'x:' + encodeURIComponent(d.sb)}`);
  }
  if (d.collapse) { S.v2Collapsed = d.collapse === '1'; return render(); }
  if (d.nav === 'entry') return go(`#/${S.v}/entry`);
  if (d.page) {
    if (d.page === 'หน้าแรก') return go(`#/${S.v}/page`);
    return toast(`prototype นี้เปิดแต่งได้เฉพาะ “หน้าแรก” — “${d.page}” ยังไม่มีใน mockup`);
  }
  if (d.sec) { S.sel = d.sec; return render(); }
  if (d.device) { S.device = d.device; return render(); }
  if (d.panel) { const [k, v] = d.panel.split(':'); S.panel[k] = v; return render(); }
  if (d.diff) { const [k, v] = d.diff.split(':'); if (k === 'all') { S.diff.hero = 'ok'; S.diff.prod = 'ok'; } else S.diff[k] = S.diff[k] === v ? null : v; S.compare = 'after'; return render(); }
  if (d.compare) { S.compare = d.compare === 'toggle' ? (S.compare === 'after' ? 'before' : 'after') : d.compare; return render(); }
  if (d.dock === 'pop') { S.pop = !S.pop; return renderDock(); }
  if (d.dock === 'mini') { S.mini = true; S.pop = false; return renderDock(); }
  if (d.dock === 'expand') { S.mini = false; return renderDock(); }
});
document.addEventListener('keydown', e => {
  const tg = e.target; if (tg && tg.closest && tg.closest('input,textarea')) return;
  if (e.key === ']') stepVersion(1);
  else if (e.key === '[') stepVersion(-1);
  else if (e.key === 'Escape' && S.pop) { S.pop = false; renderDock(); }
});
window.addEventListener('hashchange', () => { S.v2Collapsed = null; parseHash(); render(); });
parseHash(); render();
</script>
</body>
</html>
